Q.16 Create a student-registration form using basic input types.
Ans. 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Please fill in your details below.</p>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter your full name" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
                <br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                       minlength="8" required>
                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter phone number">
                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
                <br><br>

                <p>Gender:</p>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
                <br><br>
            </fieldset>

            <fieldset>
                <legend>Academic Information</legend>

                <label for="course">Select Course:</label>
                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="bca">BCA</option>
                    <option value="bba">BBA</option>
                    <option value="btech">B.Tech</option>
                    <option value="ba">BA</option>
                    <option value="bcom">B.Com</option>
                </select>
                <br><br>

                <label for="qualification">Previous Qualification:</label>
                <input type="text" id="qualification"
                       name="qualification" placeholder="e.g. Class 12">
                <br><br>

                <label for="photo">Upload Photo:</label>
                <input type="file" id="photo" name="photo"
                       accept="image/*">
                <br><br>
            </fieldset>

            <fieldset>
                <legend>Additional Information</legend>

                <label for="address">Address:</label>
                <br>
                <textarea id="address" name="address"
                          rows="4" cols="35"
                          placeholder="Enter your address"></textarea>
                <br><br>

                <input type="checkbox" id="terms" name="terms"
                       value="accepted" required>
                <label for="terms">
                    I confirm that the information is correct.
                </label>
            </fieldset>

            <br>
            <button type="submit">Register</button>
            <button type="reset">Reset Form</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Student Registration Portal</p>
    </footer>

</body>
</html>
